version: 2
updates:
  # Keep GitHub Actions pinned versions fresh (security + maintenance). The
  # repo has no JS/Python package manifests to track — vendored upstreams are
  # managed separately via Renovate submodule bumps.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
