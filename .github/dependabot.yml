version: 2
updates:
  # Keep GitHub Actions pinned versions fresh (security + maintenance). The
  # tracked package.json and pyproject.toml/uv.lock are intentionally managed
  # outside Dependabot; vendored upstreams use Renovate submodule bumps.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
      - "no-release"
  # No version updates for the Python lockfile (limit 0); this entry exists so Dependabot's security updates to
  # uv.lock carry no-release like every other bot pull request (docs/release.md).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "python:uv"
      - "no-release"
