name: Doc hygiene

# Runs the doc-hygiene check suite:
#   - check-hygiene.py:          frontmatter, anchors, clarification propagation, evals
#   - check-citations.sh:        markdown link path resolution in references/** and agents/**
#   - check-doc-links.py:        HTML link / asset path resolution in docs/**
#   - check-citation-density.py: reference source-anchor coverage and Source: audit
#   - check-workflow-metadata.mjs: workflow metadata and adapter-reference check
#   - check-verified-against.py:   verified source pins and paths are valid; SHAs resolve in initialized submodules
#   - check-reference-freshness.mjs: diff-aware date/pin and cited-root checks (advisory)
#   - check-capability-registry.mjs: role-routing registry contract
#   - node --test:            stdlib helper regressions for investigator gates
#                             and _data setup/data-contract helpers
#   - check-mcp-conformance.mjs: in-process JSON-RPC checks for role MCP servers
#   - check-orphans.py:          reference files with no inbound links from anywhere
#   - check-workflow-evals.py:   agent workflow eval coverage and fixture health
#   - check-vendor-drift.py:     refs whose cited vendor sources may have drifted
#                                (advisory — exits 1 only on confirmed file changes)
#   - check-scrape-freshness.py: stale Zscaler help-article scrapes
#                                (advisory — exit 0 unless --strict)
#
# Errors fail the build; warnings are advisory and don't block.
#
# Triggers:
#   - PRs touching references/, agents/, portable skills (.agents), runtime
#     adapters (.claude, .devin), plans, evals, docs, vendor submodules, or
#     the scripts
#   - Pushes to main on the same paths
#   - Top-level framing docs (README, PLAN, IMPROVEMENTS) — hygiene runs on
#     them so structural / link claims stay valid
#   - Weekly Monday cron (catches drift from upstream PRs / external edits)
#   - workflow_dispatch for manual runs

on:
  pull_request:
    paths:
      - 'references/**'
      - 'references/_meta/evals/**'
      - 'agents/**'
      - '.agents/**'
      - '.devin/**'
      - '.claude/**'
      - '.github/workflows/**'
      - 'docs/**'
      - 'plans/**'
      - '.gitmodules'
      - '.gitignore'
      - 'vendor/**'
      - 'README.md'
      - 'zscaler-skill-runtime.json'
      - 'PLAN.md'
      - 'IMPROVEMENTS.md'
      - 'scripts/**'
      - 'references/_meta/evals/workflow-evals.json'
      - 'zscaler'
      # Release-please metadata files: without these, the required hygiene
      # check never reports on metadata-only release PRs and they deadlock.
      - 'CHANGELOG.md'
      - 'VERSION'
      - '.release-please-manifest.json'
      - 'pyproject.toml'
      - 'package.json'
      - '.node-version'
      - 'uv.lock'
      - 'release-please-config.json'
  push:
    branches: [main]
    paths:
      - 'references/**'
      - 'references/_meta/evals/**'
      - 'agents/**'
      - '.agents/**'
      - '.devin/**'
      - '.claude/**'
      - '.github/workflows/**'
      - 'docs/**'
      - 'plans/**'
      - '.gitmodules'
      - '.gitignore'
      - 'vendor/**'
      - 'README.md'
      - 'zscaler-skill-runtime.json'
      - 'PLAN.md'
      - 'IMPROVEMENTS.md'
      - 'scripts/**'
      - 'references/_meta/evals/workflow-evals.json'
      - 'zscaler'
      # Release-please metadata files: without these, the required hygiene
      # check never reports on metadata-only release PRs and they deadlock.
      - 'CHANGELOG.md'
      - 'VERSION'
      - '.release-please-manifest.json'
      - 'pyproject.toml'
      - 'package.json'
      - '.node-version'
      - 'uv.lock'
      - 'release-please-config.json'
  schedule:
    # Mondays 13:00 UTC — aligns with issue-watch + Renovate cadence
    - cron: '0 13 * * 1'
  workflow_dispatch:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # check-release-state.mjs compares VERSION with all repository tags.
          fetch-depth: 0

      - name: Initialize submodules
        # Vendor submodules are referenced by ref-doc citations
        # (e.g. references/zia/locations.md → ../../vendor/...) and by
        # check-vendor-drift.py. CI doesn't init submodules by default;
        # do it once up front so every check below can see them.
        run: git submodule update --init --recursive

      - name: Set up uv
        # setup-uv does not ship a `v8` major-version tag — only specific
        # versions (v8.0.0, v8.1.0, ...). Pin to a concrete version.
        uses: astral-sh/setup-uv@v8.3.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - name: Run hygiene checks
        run: ./scripts/check-hygiene.py

      - name: Check portable Agent Skill contracts
        run: ./scripts/check-agent-skills.py

      - name: Check capability registry
        # Gates the role-routing registry so handoff cues resolve to valid
        # canonical workflow metadata before adapter/runtime docs depend on it.
        run: node scripts/check-capability-registry.mjs

      - name: Check workflow metadata
        run: node scripts/check-workflow-metadata.mjs

      - name: Check release metadata agreement
        run: node scripts/check-release-state.mjs

      - name: Check verified-against provenance
        run: ./scripts/check-verified-against.py

      - name: Check reference freshness semantics (advisory)
        continue-on-error: true
        env:
          REFERENCE_FRESHNESS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-reference-freshness.mjs --base "${REFERENCE_FRESHNESS_BASE:-HEAD^}" --head HEAD

      - name: Run Node helper regression tests
        run: node --test scripts/*.test.mjs scripts/bridge/*.test.mjs

      - name: Check MCP server conformance
        # Gates tool, prompt, resource, and error semantics for all role MCP
        # servers. MCP_CONFORMANCE_OFFLINE skips the optional Inspector probe
        # (an npx download) so the deterministic in-process JSON-RPC assertions
        # run without network access.
        env:
          MCP_CONFORMANCE_OFFLINE: "1"
        run: node scripts/check-mcp-conformance.mjs

      - name: Run automate-capture snapshot + reconciler tests
        # The Docusaurus blob extractor is the capture trust boundary; the OpenAPI
        # builder preserves structural compatibility and provenance; the reconciler
        # and rosetta tests pin the cross-surface synthesis. Submodules are
        # initialized above, so the reconciler integration smoke test runs (it
        # self-skips if the vendor sources are absent).
        run: |
          uv run --with pytest python -m pytest \
            scripts/automate-capture/test_extract_docusaurus_blobs.py \
            scripts/automate-capture/test_build_openapi_from_blobs.py \
            scripts/automate-capture/test_reconcile_contract.py \
            scripts/automate-capture/test_rosetta.py

      - name: Run pure agent-pattern regression tests
        run: uv run python scripts/agent_patterns.test.py

      - name: Check helper command references in docs
        run: node scripts/check-helper-command-refs.mjs

      - name: Check for broken markdown citations in references/ and agents/
        run: ./scripts/check-citations.sh

      - name: Check for broken HTML links in docs/
        run: ./scripts/check-doc-links.py

      - name: Run citation-density source-path regression tests
        # Guards the source-quality lint below (notably unquoted-source-path),
        # so a regression in the path-detection regexes is caught here rather
        # than by silently dropping legitimate backticked citation paths.
        run: ./scripts/check-citation-density.test.py

      - name: Audit local citation/source anchors
        # Density is advisory while the existing corpus is being backfilled.
        # Source-line hygiene is strict: canonical Source: lines must cite
        # vendor/script/URL evidence with consistent formatting, not internal
        # reference docs, clarification IDs, or vague scopes.
        run: ./scripts/check-citation-density.py --audit-source-quality --include-source-style --strict-sources --top 25

      - name: Audit semantic citation evidence coverage (advisory)
        # Surfaces body prose that names an evidence tier such as SDK, MCP, or
        # Terraform provider behavior while the surrounding section Source:
        # lines do not cite that evidence family. Advisory until the current
        # queue is reviewed.
        continue-on-error: true
        run: ./scripts/check-citation-density.py --audit-source-quality --include-semantic --top 80

      - name: Check citation inventory regression
        # Fails when a file loses visible Source: coverage, cited-paragraph
        # coverage, source-path mentions, or gains source-quality findings.
        # Intentional citation restructures should update
        # references/_meta/citation-inventory.json in the same PR.
        run: ./scripts/check-citation-density.py --compare-citation-inventory references/_meta/citation-inventory.json --strict-inventory --top 25

      - name: Check for orphan reference files
        run: ./scripts/check-orphans.py

      - name: Check vendor family coverage (advisory)
        # DAV-20 L1: flags a documentation area whose docs do not cite a vendor
        # source family that actually has a surface — the class that let zbi ship
        # without its Ansible coverage (#146/#149). Advisory while the per-product
        # config registry (scripts/l1_inventory.py PRODUCTS) is expanded; promote
        # to a blocking check once it covers the products with multi-family surface.
        continue-on-error: true
        run: ./scripts/check-family-coverage.py

      - name: Check for vendor-source drift
        # Drift is advisory follow-up work, not a merge gate; it surfaces in
        # the job log/summary. Without continue-on-error, every Renovate
        # submodule bump deadlocks on this required check.
        continue-on-error: true
        run: ./scripts/check-vendor-drift.py

      - name: Check Zscaler help-article scrape freshness (advisory)
        run: ./scripts/check-scrape-freshness.py

      - name: Check workflow eval shapes (static)
        run: ./scripts/check-workflow-evals.py
