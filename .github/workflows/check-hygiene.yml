name: Doc hygiene

# Runs the full local gate, `node scripts/check-full.mjs`: the knowledge-graph validate (every quote anchored)
# and strict lint, the generated-layer --check runs, the retrieval regression, every Node and Python test,
# and the doc-hygiene, link and provenance checks. One list of checks, kept in check-full.mjs and
# check-fast.mjs, so CI and a maintainer's machine run the same gate. Advisory checks report without failing.
#
# Triggers:
#   - Every PR. This workflow is a required check, so path filtering would leave
#     omitted-path PRs waiting forever for a status that can never report.
#   - Pushes to main on the same paths
#   - Weekly Monday cron (catches drift from upstream PRs / external edits)
#   - workflow_dispatch for manual runs

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'references/**'
      - 'references/_meta/evals/**'
      - 'agents/**'
      - '.agents/**'
      - '.devin/**'
      - '.claude/**'
      - '.github/workflows/**'
      - 'docs/**'
      - 'plans/**'
      - '.gitmodules'
      - '.gitignore'
      - 'vendor/**'
      - 'README.md'
      - 'zscaler-skill-runtime.json'
      - 'PLAN.md'
      - 'IMPROVEMENTS.md'
      - 'scripts/**'
      - 'references/_meta/evals/workflow-evals.json'
      - 'zscaler'
      # Keep push-to-main validation aligned with release metadata updates.
      - 'CHANGELOG.md'
      - 'VERSION'
      - '.release-please-manifest.json'
      - 'pyproject.toml'
      - 'package.json'
      - '.node-version'
      - 'uv.lock'
      - 'release-please-config.json'
  schedule:
    # Mondays 13:00 UTC — aligns with issue-watch + Renovate cadence
    - cron: '0 13 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # check-release-state.mjs compares VERSION with all repository tags.
          fetch-depth: 0

      - name: Initialize submodules
        # Claims quote files in the vendor submodules, and validate anchors
        # every quote, so the gate needs them checked out.
        run: git submodule update --init --recursive

      - name: Set up uv
        # setup-uv does not publish floating major tags. Pin a concrete release.
        uses: astral-sh/setup-uv@v10.1.0
        with:
          # Keep v9's artifact-preserving default explicit to reduce repeat downloads.
          prune-cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - name: Full gate
        env:
          # Diff-aware provenance checks compare against the PR base, or the previous main commit on push.
          REFERENCE_FRESHNESS_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: node scripts/check-full.mjs
