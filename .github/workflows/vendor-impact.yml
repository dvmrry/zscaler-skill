name: Vendor impact

on:
  pull_request:
    paths:
      - '.gitmodules'
      - 'vendor/**'
      - 'scripts/check-vendor-drift.py'
      - 'scripts/find-asymmetries.py'
      - 'scripts/vendor-impact-summary.py'
      - '.github/workflows/vendor-impact.yml'
  workflow_dispatch:

jobs:
  summarize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Generate vendor impact summary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          ./scripts/vendor-impact-summary.py \
            --base "$BASE_SHA" \
            --head HEAD \
            --output _data/schemas/vendor-impact-summary.md
          cat _data/schemas/vendor-impact-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Generate asymmetry candidates
        run: ./scripts/find-asymmetries.py

      - name: Verify impact artifact paths
        run: |
          test -f _data/schemas/vendor-impact-summary.md
          test -f _data/schemas/asymmetry-candidates.md

      - name: Upload impact artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vendor-impact
          path: |
            _data/schemas/vendor-impact-summary.md
            _data/schemas/asymmetry-candidates.md

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- vendor-impact-summary -->';
            const body = marker + '\n' + fs.readFileSync('_data/schemas/vendor-impact-summary.md', 'utf8');
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }
