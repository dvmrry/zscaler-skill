name: Vendor impact

on:
  pull_request:
    paths:
      - '.gitmodules'
      - 'vendor/**'
      - 'scripts/check-vendor-drift.py'
      - 'scripts/find-asymmetries.py'
      - 'scripts/vendor-impact-summary.mjs'
      - '.github/workflows/vendor-impact.yml'
  workflow_dispatch:

jobs:
  summarize:
    runs-on: ubuntu-latest
    env:
      ZSCALER_SKILL_RUNTIME_CONFIG: ${{ vars.ZSCALER_SKILL_RUNTIME_CONFIG }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Resolve runtime artifact paths
        id: runtime_paths
        run: |
          echo "summary_path=$(node scripts/runtime-data-path.mjs schemas vendor-impact-summary.md)" >> "$GITHUB_OUTPUT"
          echo "asymmetry_path=$(node scripts/runtime-data-path.mjs schemas asymmetry-candidates.md)" >> "$GITHUB_OUTPUT"

      - name: Generate vendor impact summary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          node scripts/vendor-impact-summary.mjs \
            --base "$BASE_SHA" \
            --head HEAD \
            --output "${{ steps.runtime_paths.outputs.summary_path }}"
          cat "${{ steps.runtime_paths.outputs.summary_path }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate asymmetry candidates
        run: ./scripts/find-asymmetries.py

      - name: Verify impact artifact paths
        run: |
          test -f "${{ steps.runtime_paths.outputs.summary_path }}"
          test -f "${{ steps.runtime_paths.outputs.asymmetry_path }}"

      - name: Upload impact artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vendor-impact
          path: |
            ${{ steps.runtime_paths.outputs.summary_path }}
            ${{ steps.runtime_paths.outputs.asymmetry_path }}

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          SUMMARY_PATH: ${{ steps.runtime_paths.outputs.summary_path }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- vendor-impact-summary -->';
            const body = marker + '\n' + fs.readFileSync(process.env.SUMMARY_PATH, 'utf8');
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }
