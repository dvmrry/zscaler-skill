name: Lint JS

# Bug-catching lint for the Node helper scripts (scripts/*.mjs), the docs site
# browser JS (docs/*.js), and the docs CSS (docs/*.css). Uses Biome with only
# the correctness / suspicious / security rule groups enabled (see biome.json) —
# style and formatting are intentionally not enforced. The repo has no
# package.json, so Biome is run via a pinned npx invocation rather than a
# committed dependency.
#
# Runs on EVERY pull request (no path filter): this is a required status check,
# and a path-filtered required check would never report on PRs that don't touch
# the filtered paths, blocking them forever. The lint is fast, so running it
# unconditionally is cheaper than that failure mode.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Biome lint (correctness / suspicious / security)
        run: npx --yes @biomejs/biome@1.9.4 lint docs scripts
