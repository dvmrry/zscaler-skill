name: Auto tag

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-tag-main
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create next version tag
        id: tag
        run: |
          set -euo pipefail

          git fetch --force --tags origin +refs/heads/main:refs/remotes/origin/main
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Manual releases must be dispatched from the main branch, not ${GITHUB_REF}."
            exit 1
          fi

          node scripts/check-release-state.mjs

          version="$(tr -d '[:space:]' < VERSION)"
          next="v${version}"
          release_commit="$(node scripts/check-release-state.mjs --release-commit)"
          release_version="$(git show "${release_commit}:VERSION" | tr -d '[:space:]')"
          if [[ "$release_version" != "$version" ]]; then
            echo "::error::Derived release commit ${release_commit} has VERSION ${release_version}, expected ${version}."
            exit 1
          fi

          echo "tag=${next}" >> "$GITHUB_OUTPUT"
          echo "release_commit=${release_commit}" >> "$GITHUB_OUTPUT"

          if ! git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main; then
            echo "::error::Derived release commit ${release_commit} is not reachable from origin/main."
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$release_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::VERSION ${version} was introduced by ${release_commit}, but this push ends at ${GITHUB_SHA}. Run this workflow manually from main to repair the release."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/${next}" >/dev/null; then
            tagged_commit="$(git rev-parse "refs/tags/${next}^{commit}")"
            if [[ "$tagged_commit" != "$release_commit" ]]; then
              echo "::error::${next} points to ${tagged_commit}, not release commit ${release_commit}."
              exit 1
            fi

            echo "${next} already points to release commit ${release_commit}."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next" "$release_commit" -m "Release $next"
          git push origin "refs/tags/${next}"

          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.tag.outputs.release_commit }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release ${TAG} already exists."
            exit 0
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" \
            --title "$TAG" \
            --generate-notes
