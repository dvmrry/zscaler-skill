name: CodeQL

# Static security analysis for the repo's own code: JavaScript (scripts/*.mjs,
# docs/*.js) and Python (scripts/*.py). Vendored upstream code under vendor/ is
# not analyzed: submodules are deliberately not checked out here, so CodeQL only
# sees first-party code. Results surface in the repository Security tab.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1" # weekly, Monday 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: ${{ matrix.language }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.4
        with:
          category: "/language:${{ matrix.language }}"
