name: Regenerate on pin bumps

# Renovate moves submodule pins but cannot run the generators, so every bump failed the gate on the layers built
# from vendored sources: the API surfaces, the zscalerctl import and config types, the resolve goldens, the spines
# and verified.json. This regenerates them on the bump's branch and commits the result, so what is left failing is
# only quotes the new code broke, which scripts/kb-reanchor.mjs repairs (docs/maintenance.md).
#
# A push made with GITHUB_TOKEN starts no workflows, so the job dispatches the required checks on the branch itself.
# Renovate leaves a branch alone once someone else has committed to it; the next bump comes after this one merges.

on:
  pull_request:
    paths:
      - '.gitmodules'
      - 'vendor/**'

concurrency:
  group: bump-regenerate-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    # Renovate's branches in this repository only: a fork's pull request never gets a token that can push.
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: ${{ github.head_ref }}
      BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - name: Set up Go
        # export-zscalerctl builds the pinned zscalerctl to read its catalogue.
        uses: actions/setup-go@v7
        with:
          go-version-file: vendor/zscalerctl/go.mod

      - name: Regenerate
        run: |
          node scripts/gen-surfaces.mjs all
          if ! git diff --quiet "$BASE" HEAD -- vendor/zscalerctl; then node scripts/kb.mjs export-zscalerctl; fi
          node scripts/kb.mjs import-types
          node scripts/regen-goldens.mjs
          node scripts/gen-spine.mjs
          node scripts/gen-text.mjs
          # verified exits 1 while a citation fails; the record is written either way.
          node scripts/kb.mjs verified || [ $? -eq 1 ]

      - name: Commit to the bump's branch
        run: |
          if [ -z "$(git status --porcelain -- references scripts/fixtures/kb-golden)" ]; then
            echo "The generated layers were already current." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git add references scripts/fixtures/kb-golden
          if git status --porcelain | grep -qv '^[MADR] '; then
            echo "Regenerating changed files outside references/ and the goldens:" >&2
            git status --porcelain | grep -v '^[MADR] ' >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore(kb): regenerate the layers built from vendored sources for the new pins"
          git push origin "HEAD:$BRANCH"
          for wf in check-hygiene.yml lint-js.yml lint-py.yml; do gh workflow run "$wf" --ref "$BRANCH"; done
          git show --stat --format='Regenerated: %s' HEAD >> "$GITHUB_STEP_SUMMARY"
