name: Release Please

on:
  # Manually prepares the release PR. Publishing is handled after merge by the
  # VERSION-driven auto-tag workflow, so ordinary main pushes do not create
  # synthetic patch releases.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # With a fine-grained PAT in RELEASE_PLEASE_TOKEN the release PR
          # triggers required checks normally; without it, behavior is unchanged
          # and admin-merge remains the standing procedure for the bot-token deadlock.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
