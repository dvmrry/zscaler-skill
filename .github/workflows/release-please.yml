name: Release Please

on:
  # Prepare or update the release PR as releasable commits land. After that PR
  # merges, Release Please also publishes the matching tag and GitHub release.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # With a fine-grained PAT in RELEASE_PLEASE_TOKEN the release PR
          # triggers required checks normally; without it, behavior is unchanged
          # and admin-merge remains the standing procedure for the bot-token deadlock.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: false
