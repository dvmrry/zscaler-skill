name: Maintenance digest

on:
  schedule:
    # Mondays 13:20 UTC, after Renovate / issue-watch / hygiene begin.
    - cron: '20 13 * * 1'
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      ZSCALER_SKILL_RUNTIME_CONFIG: ${{ vars.ZSCALER_SKILL_RUNTIME_CONFIG }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.0

      - name: Resolve runtime artifact path
        id: runtime_paths
        run: echo "digest_path=$(node scripts/runtime-data-path.mjs schemas maintenance-digest.md)" >> "$GITHUB_OUTPUT"

      - name: Update sticky maintenance issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/maintenance-digest.py \
            --stale-days 60 \
            --scrape-days 90 \
            --output "${{ steps.runtime_paths.outputs.digest_path }}" \
            --sticky-label maintenance-digest \
            --bootstrap-if-missing
          cat "${{ steps.runtime_paths.outputs.digest_path }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: maintenance-digest
          path: ${{ steps.runtime_paths.outputs.digest_path }}
