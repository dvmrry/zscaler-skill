name: release-notes

# Every pull request either adds the next version's notes, docs/releases/vX.Y.Z.md, or carries the no-release
# label. scripts/release-version.sh decides which; the release workflow runs the same script on the merge, so
# what merges is what review saw. See docs/release.md.
# A change that ships files to the skill's users (scripts/release-scope.mjs) must release; only the refresh and
# dependency bots may label such a change no-release.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: read

jobs:
  release-notes:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the release decision
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          set -euo pipefail
          # Read the labels now, not from the event: a bot opens its pull request and labels it a moment later, so
          # the "opened" event never carries the label.
          NO_RELEASE="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq 'any(.labels[]; .name == "no-release")')"
          version="$(bash scripts/release-version.sh HEAD^1 HEAD)"
          if [[ "$version" == "none" && "$NO_RELEASE" != "true" ]]; then
            echo "::error::add docs/releases/vX.Y.Z.md (the next version's notes) or the no-release label"
            exit 1
          fi
          if [[ "$version" != "none" && "$NO_RELEASE" == "true" ]]; then
            echo "::error::this change adds the notes for $version but carries the no-release label"
            exit 1
          fi
          # no-release is only for a change that ships nothing (scripts/release-scope.mjs). The refresh and
          # dependency bots are the exception: their changes ship in the next release.
          if [[ "$NO_RELEASE" == "true" && "$AUTHOR_TYPE" != "Bot" ]]; then
            shipped="$(node scripts/release-scope.mjs HEAD^1 HEAD)"
            if [[ -n "$shipped" ]]; then
              echo "::error::this change ships files to the skill's users, so it releases a version: add docs/releases/vX.Y.Z.md and bump VERSION, pyproject.toml and uv.lock, and drop the no-release label"
              printf '%s\n' "$shipped"
              exit 1
            fi
          fi
          echo "release decision: $version"
