[project]
name = "zscaler-skill"
version = "0.16.2"
description = "Zscaler skill — references, scripts, evals, and tooling for AI-assisted Zscaler operations"
requires-python = ">=3.10"

# This package isn't intended to be `pip install`ed. It's a skill workspace, not a library.
# This pyproject.toml exists for two reasons:
#
# 1. Aggregated visibility of the third-party Python deps the skill's scripts use.
#    Dependency-bearing executables self-declare via PEP 723 inline metadata
#    (https://peps.python.org/pep-0723/). Library modules, test modules, and
#    some stdlib-only executables intentionally omit it. The list below mirrors
#    the union of third-party declarations for discoverability.
#
# 2. `uv sync --extra scripts` lets contributors install all script deps once
#    rather than letting uv resolve per-script on first run.
#
# Run an executable by its documented command. Where PEP 723 metadata is
# present, uv resolves and caches dependencies without a project-level install.

[project.optional-dependencies]
scripts = [
    # Frontmatter parsing (check-hygiene.py, check-vendor-drift.py)
    "pyyaml>=6",

    # Async HTTP for upstream issue polling (issue-watch.py)
    "httpx>=0.27",

    # Skill PDF rendering (render-skill-pdf.py)
    "markdown>=3.5",
    "pymdown-extensions>=11.0.1",
]

# Some scripts are stdlib-only (deps = [] in their PEP 723 block):
# ab-test-prompt, check-doc-links, check-orphans, check-scrape-freshness,
# find-asymmetries, run-evals.
# They use the uv-script shebang for consistency, not because they need
# external deps.

[tool.ruff]
target-version = "py310"
extend-exclude = ["vendor", "_data"]

[tool.ruff.lint]
# Bug-catching only, mirroring the Biome JS config: pyflakes (F), syntax (E9),
# and bugbear (B). Style/formatting (E/W), complexity, and the noisy bandit (S)
# subprocess/try-except rules are intentionally not enforced.
select = ["F", "E9", "B"]
